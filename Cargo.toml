[package]
name = "suchbar"
description = "suchbar - enduser-learnable-language for database queries."
authors = ["Micha Glave <mig@xilab.net>"]
version = "1.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NORICS-net/suchbar"
categories = ["database", "text-processing", "parser-implementations"]
keywords = ["human", "human-friendly", "parser", "search-engine", "postgresql"]

[lib]

[dependencies]
pest = "2.8"
pest_derive = "2.8"
permeable = "0.3"
timewarp = "0.4"
itertools = "0.14.0"

[dev-dependencies]
similar-asserts  = "2.0"
